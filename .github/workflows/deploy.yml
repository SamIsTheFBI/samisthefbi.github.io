name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: Compile the LaTeX PDF and commit it to the repo
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex

      - name: Commit compiled PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          cp resume.pdf public/resume.pdf
          git add public/resume.pdf
          git diff --staged --quiet || git commit -m "chore: update resume.pdf [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifact
          path: resume.pdf
          if-no-files-found: error

  # JOB 2: Build the Astro Site (including the PDF)
  build:
    needs: build_latex # <--- Waits for latex build to finish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      # Download the PDF generated in the previous job
      - name: Download Resume PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-artifact
          path: download_temp

      # Move and Rename the file to public/resume.pdf
      # In Astro, files in 'public' are moved to the root of the site build
      - name: Move PDF to Public folder
        run: |
          mkdir -p public
          mv download_temp/resume.pdf public/resume.pdf
          echo "PDF moved to public/resume.pdf"

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # The action will now build the site, and since resume.pdf is in /public,
        # it will be included in the final deployment.

  # JOB 3: Deploy to GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
