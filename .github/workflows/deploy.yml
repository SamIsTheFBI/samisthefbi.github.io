name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: Check if LaTeX files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      latex: ${{ steps.check.outputs.latex }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE '\.(tex|sty|bib)$'; then
            echo "latex=true" >> $GITHUB_OUTPUT
          else
            echo "latex=false" >> $GITHUB_OUTPUT
          fi

  # JOB 2: Compile the LaTeX PDF and commit it to the repo
  build_latex:
    needs: changes
    if: needs.changes.outputs.latex == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex

      - name: Commit compiled PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p public
          cp resume.pdf public/resume.pdf
          git add public/resume.pdf
          git diff --staged --quiet || git commit -m "chore: update resume.pdf [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifact
          path: resume.pdf
          if-no-files-found: error

  # JOB 3: Build the Astro Site (including the PDF)
  build:
    needs: [changes, build_latex]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Download Resume PDF artifact (if latex was rebuilt)
        if: needs.build_latex.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: resume-artifact
          path: download_temp

      - name: Move PDF to Public folder
        run: |
          mkdir -p public
          if [ -f download_temp/resume.pdf ]; then
            mv download_temp/resume.pdf public/resume.pdf
          fi
          echo "PDF at public/resume.pdf"

      - name: Install, build, and upload your site
        uses: withastro/action@v3

  # JOB 4: Deploy to GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
